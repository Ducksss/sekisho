# ngrok traffic policy for make tunnel-ngrok: only MultiBaas webhook deliveries reach the
# gate. Everything else, including the officer decision endpoint, gets a 404 at the edge.
on_http_request:
  - expressions:
      - "!(req.method == 'POST' && req.url.path == '/webhooks/multibaas')"
    actions:
      - type: custom-response
        config:
          status_code: 404
          body: "not found"
